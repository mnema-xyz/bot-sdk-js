name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Lint with the size limits, types, build, the offline tests and the package
  # contents. Node 24 is the oldest the SDK supports, 26 the current one.
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/lint/package-lock.json

      - name: Install
        run: |
          npm ci --no-audit --no-fund
          npm --prefix tools/lint ci --no-audit --no-fund

      - name: Lint, typecheck, build, test, pack
        run: npm run check

  # The contract tests against a real Mnema Talk server, from its main (what
  # comes next) and from its latest release (what people run): the server's
  # TestSDKContract starts a real router on a database, creates a bot, a
  # channel and a signed-in member, and runs `npm run test:contract` in
  # sdk/typescript, where this checkout is put.
  contract-talk:
    name: contract (talk ${{ matrix.talk }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        talk: [main, release]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: mnema
          POSTGRES_PASSWORD: mnema
          POSTGRES_DB: mnema_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mnema -d mnema_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway CI-only database credentials for the service container above.
      TEST_DATABASE_URL: postgres://mnema:mnema@localhost:5432/mnema_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: sdk

      - name: Which talk
        id: talk
        env:
          GH_TOKEN: ${{ github.token }}
          TALK: ${{ matrix.talk }}
        run: |
          set -euo pipefail
          if [ "$TALK" = main ]; then ref=main; else ref="$(gh api repos/mnema-xyz/talk/releases/latest --jq .tag_name)"; fi
          echo "talk ref: $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: mnema-xyz/talk
          ref: ${{ steps.talk.outputs.ref }}
          path: talk

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: talk/go.mod
          cache: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdk/package-lock.json

      - name: Put the SDK into the server's tree
        run: |
          set -euo pipefail
          rm -rf talk/sdk/typescript
          mv sdk talk/sdk/typescript
          (cd talk/sdk/typescript && npm ci --no-audit --no-fund)

      - name: Contract tests against a real server
        working-directory: talk
        env:
          SDK_CONTRACT: '1'
        run: |
          set -euo pipefail
          go test -tags=integration -count=1 -v -run '^TestSDKContract$/^typescript$' ./internal/server | tee "$RUNNER_TEMP/contract.log"
          # A skip (no SDK_CONTRACT, no Node) would pass silently: require the run.
          grep -q -- '--- PASS: TestSDKContract/typescript' "$RUNNER_TEMP/contract.log"

  # The required check: green only when both contract runs passed.
  contract:
    needs: contract-talk
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: both contract runs passed
        env:
          RESULT: ${{ needs.contract-talk.result }}
        run: test "$RESULT" = success
